name: release

# Push a tag like v1.2.0 to publish a GitHub release with the jar
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: |
            17
            21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: ./gradlew build

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jars=$(ls build/libs/*.jar | grep -v -- '-plain.jar')
          gh release create "$GITHUB_REF_NAME" $jars build/libs/*.sha256 --title "$GITHUB_REF_NAME" --generate-notes
